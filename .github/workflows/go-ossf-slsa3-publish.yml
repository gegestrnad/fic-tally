# SLSA3-compliant Go release builder (slsa-framework/slsa-github-generator).
#
# Builds fic-tally for linux/windows/darwin (amd64 + arm64) with SLSA3
# provenance, and uploads the binaries + provenance as release assets.
#
# Flow: push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# The builder's upload-assets job (gated on a tag ref) creates the GitHub
# release for that tag and attaches one binary + .provenance per platform.
#
# Docs: https://github.com/slsa-framework/slsa-github-generator#using-the-go-builder

name: SLSA Go releaser
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    permissions:
      id-token: write # To sign the provenance.
      contents: write # To upload release assets.
      actions: read # To read workflow path.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version: '1.25'
      config-file: .slsa-goreleaser/${{ matrix.os }}-${{ matrix.arch }}.yml
